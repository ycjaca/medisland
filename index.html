<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ycjacademy 方塊世界</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a full-screen block world of the round garden. Walk it like Minecraft (WASD + mouse) or with a thumb stick on phones; the sky follows the real sun. A plain list of the plots sits below the game. */
:root{
  --moss:#1b2619;
  --moss-2:#232f20;
  --line:#33452f;
  --cream:#efe8d4;
  --cream-soft:#b8b59c;
  --sun:#f2b134;
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--moss);color:var(--cream);font-family:var(--body);line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px}

.stage{position:relative;height:100vh;height:100svh;overflow:hidden;background:#8cc4ea;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
.tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;border:2px solid #2b2414;padding:3px 10px 4px;border-radius:0;
  background:#f4e7c4;color:#2b2414;font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.tag.fallow{background:#d9cba6;color:#6b5330}
.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none;opacity:.85}
.cross::before,.cross::after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
.cross::before{left:8px;top:0;width:2px;height:18px}
.cross::after{left:0;top:8px;width:18px;height:2px}
.cross.on::before,.cross.on::after{background:#f2b134;mix-blend-mode:normal;box-shadow:0 0 0 1px #2b2414}

.hud{position:absolute;inset:0;pointer-events:none}
.brand{position:absolute;left:14px;top:12px;font-family:var(--display);font-weight:700;color:#fff;font-size:clamp(18px,2.6vw,28px);line-height:1;text-shadow:2px 2px 0 rgba(0,0,0,.45)}
.brand small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.06em;margin-top:6px;opacity:.95}
.clock{position:absolute;right:12px;top:12px;pointer-events:auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;
  background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.35);padding:7px 10px;font-family:var(--mono);font-size:11px;color:#fff}
.clock .row{display:flex;gap:6px;align-items:center}
.clock input[type=range]{width:110px;accent-color:var(--sun)}
.chip{border:1px solid rgba(255,255,255,.7);padding:1px 8px;background:transparent;cursor:pointer;font-family:var(--mono);font-size:11px;color:#fff}
.prompt{position:absolute;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);pointer-events:auto;cursor:pointer;display:none;
  background:#f4e7c4;color:#2b2414;border:3px solid #2b2414;box-shadow:4px 4px 0 rgba(0,0,0,.4);padding:8px 16px;font-family:var(--display);font-weight:700;font-size:17px;white-space:nowrap}
.prompt kbd{font-family:var(--mono);font-size:12px;background:#2b2414;color:#f4e7c4;padding:1px 6px;margin-right:8px}
.listbtn{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);pointer-events:auto;cursor:pointer;
  background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.35);color:#fff;font-family:var(--mono);font-size:11.5px;padding:4px 12px}
.keys{position:absolute;left:14px;bottom:calc(12px + env(safe-area-inset-bottom));font-family:var(--mono);font-size:11px;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.6);line-height:1.5}
.joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);display:none}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.7)}
.jump{position:absolute;right:calc(22px + env(safe-area-inset-right));bottom:calc(64px + env(safe-area-inset-bottom));width:72px;height:72px;border-radius:50%;pointer-events:auto;touch-action:none;
  border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.16);color:#fff;font-size:13px;display:none}
.jump:active{background:rgba(255,255,255,.4);transform:scale(.94)}
.touch .jump{display:block}
.touch .keys{display:none}
body{overflow:hidden}

.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,20,12,.55);text-align:center;padding:20px;cursor:pointer}
.start h1{margin:0;font-family:var(--display);font-size:clamp(34px,7vw,72px);line-height:1;color:#fff;text-shadow:4px 4px 0 #2b2414;letter-spacing:.02em}
.start p{margin:0;color:#fff;font-size:14px;max-width:34em;text-shadow:1px 1px 0 rgba(0,0,0,.5)}
.start .go2{border:3px solid #2b2414;background:#7fbf4f;color:#17240f;font-family:var(--display);font-weight:700;font-size:20px;padding:10px 28px;box-shadow:5px 5px 0 rgba(0,0,0,.45);cursor:pointer}
.start .how{font-family:var(--mono);font-size:12px;color:#e8efe0;line-height:1.7}
.start[hidden]{display:none}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-size:13px;pointer-events:none}
@media (max-width:640px){.clock input[type=range]{width:80px}.clock{font-size:10px;padding:5px 7px}.brand small{display:none}}

main{max-width:1120px;margin:0 auto;padding:40px 20px 70px}
main h2{font-family:var(--display);font-size:28px;margin:0 0 4px}
main>p{color:var(--cream-soft);margin:0 0 20px;max-width:42em}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--cream-soft);margin:0 0 22px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.zc{text-align:left;background:var(--moss-2);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:0;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.zc:hover{background:#28361f}
.zc h3{font-family:var(--display);font-size:22px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.zc h3 span{font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--cream-soft)}
.zc p{margin:0;font-size:13.5px;color:var(--cream-soft)}
.zc ul{list-style:none;margin:0;padding:0;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.zc li{display:flex;gap:8px;align-items:center}
.zc .empty{font-family:var(--mono);font-size:12px;color:#8e8a70}

.scrim{position:fixed;inset:0;background:rgba(8,14,8,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
aside.panel{position:fixed;z-index:21;top:0;right:0;height:100%;width:min(460px,100%);background:#1a2618;border-left:1px solid var(--line);transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
aside.panel.open{transform:none}
@media (max-width:700px){aside.panel{top:auto;bottom:0;height:auto;max-height:82%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(102%)}}
@media (prefers-reduced-motion:reduce){aside.panel,.scrim{transition:none}}
.p-head{padding:22px 22px 14px;border-bottom:1px solid var(--line);position:relative}
.p-head .k{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--c)}
.p-head h2{font-family:var(--display);font-size:32px;margin:2px 0 6px;line-height:1.15}
.p-head p{margin:0;color:var(--cream-soft);font-size:14px}
.close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:20px;line-height:1}
.p-body{overflow-y:auto;padding:6px 22px 28px}
.item{padding:16px 0;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.item:last-child{border-bottom:0}
.stage-l{font-family:var(--mono);font-size:11.5px;display:flex;align-items:center;gap:6px;color:var(--cream-soft)}
.item h4{margin:0;font-size:16px;font-weight:500}
.item p{margin:0;font-size:13.5px;color:var(--cream-soft)}
.go{align-self:flex-start;margin-top:4px;text-decoration:none;font-size:13px;padding:6px 14px;border-radius:20px;background:var(--sun);color:#2b2414;font-weight:500}
.fallow-note{font-family:var(--mono);font-size:13px;color:#8e8a70;padding:20px 0}
.exhibit{border:1px solid #4a3c1c;background:#2a2414;border-radius:4px;padding:16px;margin:14px 0 4px;display:flex;flex-direction:column;gap:8px}
.exhibit .k{font-family:var(--mono);font-size:11.5px;color:var(--sun);letter-spacing:.08em}
.exhibit h4{font-family:var(--display);font-size:24px;margin:0}
.exhibit p{margin:0;font-size:13.5px;color:var(--cream-soft)}
footer{border-top:1px solid var(--line);max-width:1120px;margin:0 auto;padding:18px 20px 30px;font-size:12px;color:#8e8a70;font-family:var(--mono)}

.brand{left:62px}
.menubtn{position:absolute;left:12px;top:10px;width:40px;height:40px;pointer-events:auto;cursor:pointer;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:20px;line-height:1}
.menubtn:hover{background:rgba(0,0,0,.65)}
.mini{position:absolute;left:12px;top:60px;width:112px;height:112px;padding:0;border-radius:50%;overflow:hidden;pointer-events:auto;cursor:pointer;border:3px solid rgba(255,255,255,.75);background:#274a2a;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.mini canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.4);color:#fff;font-family:var(--display);font-weight:700;font-size:22px;padding:6px 18px;opacity:0;transition:opacity .3s;white-space:nowrap}
.toast.show{opacity:1}
.jump.sneak{right:calc(104px + env(safe-area-inset-right));bottom:calc(40px + env(safe-area-inset-bottom));width:56px;height:56px}
.jump.sneak[aria-pressed="true"]{background:rgba(242,177,52,.55);border-color:#f2b134}
.startrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.start .go2.alt{background:#f4e7c4;color:#2b2414}
.bigmap{position:absolute;inset:0;background:rgba(8,14,8,.6);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bigmap[hidden]{display:none}
.bm-box{background:#1a2618;border:3px solid #f4e7c4;box-shadow:6px 6px 0 rgba(0,0,0,.45);padding:10px;cursor:default;text-align:center}
.bm-box canvas{width:min(78vmin,560px);height:min(78vmin,560px);display:block;image-rendering:pixelated;cursor:pointer}
.bm-box p{margin:8px 0 0;font-family:var(--mono);font-size:12px;color:var(--cream-soft)}
.mscrim{position:fixed;inset:0;background:rgba(8,14,8,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:18}
.mscrim.open{opacity:1;pointer-events:auto}
aside.menu{position:fixed;z-index:19;top:0;left:0;height:100%;width:min(380px,88vw);background:#1a2618;border-right:3px solid #33452f;transform:translateX(-103%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;visibility:hidden}
aside.menu.open{transform:none;visibility:visible}
.m-head{position:relative;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.m-head h2{margin:0;font-family:var(--display);font-size:26px;line-height:1.1}
.m-head p{margin:2px 0 0;font-family:var(--mono);font-size:12px;color:var(--cream-soft)}
.m-body{overflow-y:auto;padding:14px 20px 30px;display:flex;flex-direction:column;gap:10px}
.m-body h3{font-family:var(--display);font-size:20px;margin:12px 0 0}
.m-note{margin:0;font-size:12.5px;color:var(--cream-soft)}
.m-row{display:flex;gap:8px;flex-wrap:wrap}
.mbtn{flex:1 1 auto;border:2px solid #2b2414;background:#f4e7c4;color:#2b2414;font-family:var(--display);font-weight:700;font-size:15px;padding:7px 10px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.mbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.4)}
.set{display:flex;align-items:center;gap:10px;font-size:13.5px}
.set label{flex:none;width:6.5em;color:var(--cream-soft)}
.set input[type=range]{flex:1;min-width:0;accent-color:var(--sun)}
.set select{background:#232f20;color:var(--cream);border:1px solid var(--line);padding:3px 6px;font:inherit}
.set span{font-family:var(--mono);font-size:11.5px;color:var(--cream-soft)}
.m-body .legend{margin:0}
@media (max-width:640px){.mini{width:92px;height:92px}.toast{font-size:18px}}
@media (prefers-reduced-motion:reduce){aside.menu,.mscrim,.toast{transition:none}}
</style>
</head>
<body>

<section class="stage" id="stage" aria-label="方塊花園：用鍵盤或觸控在花園裡走動">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="cross" id="cross" hidden></div>
  <div class="hud" id="hud">
    <button class="menubtn" id="menuBtn" type="button" aria-label="打開選單" aria-controls="menu">☰</button>
    <div class="brand">ycjacademy</div>
    <button class="mini" id="mini" type="button" aria-label="小地圖，點一下打開大地圖"><canvas id="miniCv" width="224" height="224"></canvas></button>
    <div class="clock" aria-live="polite"><div id="where">—</div><div id="sunline">—</div></div>
    <div class="keys" id="keys">WASD 移動 · 空白鍵 跳 · Ctrl 衝刺 · Shift 蹲 · E 進入 · V 視角 · M 地圖 · Esc 選單</div>
    <div class="toast" id="toast" aria-live="polite"></div>
    <button class="prompt" id="prompt" type="button"></button>
    <div class="joy" id="joy"><i id="knob"></i></div>
    <button class="jump" id="jumpBtn" type="button" aria-label="跳">跳</button>
    <button class="jump sneak" id="sneakBtn" type="button" aria-label="蹲下" aria-pressed="false">蹲</button>
  </div>
  <div class="bigmap" id="bigmap" hidden><div class="bm-box"><canvas id="bigCv" width="672" height="672"></canvas><p>點一個區域，自動走過去 · 按 M 或點外面關閉</p></div></div>
  <div class="loading" id="loading">方塊堆疊中…</div>
  <div class="start" id="start" hidden>
    <h1>ycjacademy</h1>
    <p>一位家醫科住院醫師的學習花園。沿著環形小徑走，路的兩旁是各個區域。</p>
    <div class="startrow"><button class="go2" id="startBtn" type="button">開始散步</button><button class="go2 alt" id="tourStart" type="button">導覽模式</button></div>
    <div class="how" id="how"></div>
  </div>
</section>

<div class="mscrim" id="mscrim"></div>
<aside class="menu" id="menu" aria-label="選單" aria-hidden="true">
  <div class="m-head"><h2>ycjacademy</h2><p>方塊花園</p><button class="close" id="menuClose" type="button" aria-label="關閉選單">×</button></div>
  <div class="m-body">
    <div class="m-row"><button class="mbtn" id="tourBtn" type="button">▶ 導覽模式</button><button class="mbtn" id="mapBtn" type="button">地圖</button><button class="mbtn" id="viewBtn" type="button">視角</button></div>
    <h3>園區導覽</h3>
    <p class="m-note">點卡片看內容。每件作品都標著生長階段；標著「整地中」的區域還在規劃。</p>
    <div class="legend" id="legend"></div>
    <div class="cards" id="cards"></div>
    <h3>設定</h3>
    <div class="set"><label for="scrub">時間預覽</label><input id="scrub" type="range" min="-12" max="12" step="0.25" value="0"><button class="chip" id="nowBtn" type="button">現在</button></div>
    <div class="set"><label for="sens">視角靈敏度</label><input id="sens" type="range" min="0.4" max="2.5" step="0.1" value="1"></div>
    <div class="set"><label for="qual">畫質</label><select id="qual"><option value="auto">自動</option><option value="2">高</option><option value="1">中</option><option value="0">低</option></select><span id="qualNow"></span></div>
    <div class="set"><button class="chip" id="locBtn" type="button">用我的位置</button></div>
    <p class="m-note">天空依你所在地的太陽位置即時變化（未授權位置時，依瀏覽器時區推估）。</p>
  </div>
</aside>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle" aria-hidden="true">
  <div class="p-head"><div class="k" id="pKey"></div><h2 id="pTitle"></h2><p id="pDesc"></p><button class="close" id="closeBtn" aria-label="關閉">×</button></div>
  <div class="p-body" id="pBody"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= content: edit here ================= */
const STAGES = {
  seed:{label:"種子 · 構想", color:"#b08a5a"},
  sprout:{label:"發芽 · 製作中", color:"#8fbf5a"},
  bloom:{label:"開花 · 完成", color:"#e58fb0"},
  fruit:{label:"結果 · 已報告／使用", color:"#e0703a"}
};
// order = order along the ring path, starting at the gate
const ZONES = [
  {id:"gate", name:"大門", sub:"關於・導覽", color:"#d9c79a",
   desc:"歡迎光臨。這裡是 Ray 的學習花園：家醫科住院醫師，對醫療 AI、數學與物理有興趣。", items:[]},
  {id:"expo", name:"展覽會場", sub:"學會專頁", color:"#f2b134",
   desc:"每一場學會是一檔展覽，把聽到的內容整理成可以逛的展。", items:[], exhibits:[
     {k:"第一檔 · 2026.10.18", t:"115 秋季會・家醫群島", note:"台灣家庭醫學醫學會 115 年度秋季學術研討會。九座主題島、34 場講題，7 個深入頁：糖尿病、減重、心房顫動、LDL-C、失眠與睡眠呼吸中止、肌筋膜疼痛、肌少症。", stage:"bloom", url:"islands/"}]},
  {id:"nursery", name:"苗圃", sub:"構想與進行中", color:"#c9a25a",
   desc:"還在育苗的專案。長大了就移植到其他區域。", items:[
     {t:"鋼琴扒譜擴充功能", stage:"seed", note:"把影片裡的鋼琴演奏轉成樂譜。"},
     {t:"語言學習短影片自動產生", stage:"sprout", note:"英文、日文單字短影片。"}]},
  {id:"herb", name:"藥草園", sub:"臨床筆記與卡片", color:"#7fb26a",
   desc:"門診用得到的知識，一株一株種下，隨手可摘。", items:[
     {t:"皮膚科 Anki 卡片", stage:"sprout", note:"依 Fitzpatrick 圖譜製作，目標是應付皮膚科門診。"}]},
  {id:"clinic", name:"門診實務", sub:"看診思路手冊", color:"#bb3f26",

const RAD=Math.PI/180;
function sunPos(date,lat,lon){
  const d=date.getTime()/86400000+2440587.5-2451545.0;
  const L=(280.460+0.9856474*d)%360, g=((357.528+0.9856003*d)%360)*RAD;
  const lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*RAD, eps=(23.439-0.0000004*d)*RAD;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)), dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  const gmst=(280.46061837+360.98564736629*d)%360, H=(gmst+lon)*RAD-ra, la=lat*RAD;
  const alt=Math.asin(Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(H));
  const az=Math.atan2(-Math.sin(H),Math.tan(dec)*Math.cos(la)-Math.sin(la)*Math.cos(H));
  return {alt:alt/RAD, az:((az/RAD)+360)%360};
}

    let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);

    let autoGo=false;
    if(auto){ if(mag>0||jumpQueued)cancelAuto(); else{const wp=auto.wps[auto.i],dx=wp[0]-P.x,dz=wp[1]-P.z;
      if(Math.hypot(dx,dz)<0.8){auto.i++;if(auto.i>=auto.wps.length)arrive()}
      else{let dy=Math.atan2(-dx,-dz)-P.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));P.yaw+=dy*Math.min(1,dt*7);P.pitch+=(-0.1-P.pitch)*Math.min(1,dt*3);f=Math.abs(dy)<1.2?1:0.25;s=0;autoGo=true;
        auto.t+=dt;if(auto.t>1.5){if(Math.hypot(P.x-auto.px,P.z-auto.pz)<0.6){P.x=wp[0];P.z=wp[1];P.y=topY(Math.floor(wp[0]),Math.floor(wp[1]))+1;P.vy=0}auto.t=0;auto.px=P.x;auto.pz=P.z}}}}
    const sneak=!autoGo&&!!(keys.ShiftLeft||keys.ShiftRight||sneakOn), sprint=!sneak&&f>0&&(keys.ControlLeft||keys.ControlRight||sprintLatch||jm>0.92||autoGo);
    const sp=sneak?1.3:sprint?5.6:4.3;
    const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
    const tvx=(fx*f+rx*s)*sp,tvz=(fz*f+rz*s)*sp,k=Math.min(1,(P.ground?14:3)*dt);
    P.vx+=(tvx-P.vx)*k;P.vz+=(tvz-P.vz)*k;P.vy=Math.max(-50,P.vy-32*dt);
    if(jumpQueued&&P.ground)P.vy=8.6;jumpQueued=false;
    const wasGround=P.ground;P.ground=false;
    if(moveAxis(1,P.vy*dt))P.vy=0;
    const ox=P.x,oz=P.z;
    const bx=moveAxis(0,P.vx*dt);if(sneak&&wasGround&&P.ground&&!hit(P.x,P.y-0.1,P.z))P.x=ox;

    if(bx)P.vx=0;if(bz)P.vz=0;
    if((bx||bz)&&P.ground&&(jm>0.3||autoGo))P.vy=8.6; // auto-jump on touch, like Pocket Edition
    if(P.y<-20){P.x=SPAWN.x;P.y=SPAWN.y;P.z=SPAWN.z;P.vy=0}
    eyeH+=((sneak?1.45:1.62)-eyeH)*Math.min(1,dt*14);
  }
  {const cp=Math.cos(P.pitch),vx=-Math.sin(P.yaw)*cp,vy=Math.sin(P.pitch),vz=-Math.cos(P.yaw)*cp;
   if(view===1){let d=0.4;for(;d<5.4;d+=0.2)if(SOLID[get(Math.floor(P.x-vx*d),Math.floor(P.y+2.15-vy*d),Math.floor(P.z-vz*d))])break;d=Math.max(0.3,d-0.35);camera.position.set(P.x-vx*d,P.y+2.15-vy*d,P.z-vz*d)}
   else camera.position.set(P.x,P.y+eyeH,P.z)}
  camera.rotation.set(P.pitch,P.yaw,0);
  // the walker (third person)
  doc.visible=view===1;if(doc.visible){const spd=Math.hypot(P.vx,P.vz);walkPh+=dt*spd*2.4;const sw=Math.sin(walkPh)*Math.min(1,spd/4)*0.9;
    doc.position.set(P.x,P.y,P.z);doc.rotation.y=P.yaw;limbs[0].rotation.x=sw;limbs[1].rotation.x=-sw;limbs[2].rotation.x=-sw;limbs[3].rotation.x=sw}
  // clouds drift east
  for(let i=0;i<CN;i++){const c=cloudD[i];c[0]+=dt*1.1;if(c[0]>170)c[0]-=340;cloudO.position.set(c[0],c[1],c[2]);cloudO.scale.set(c[3],2.5,c[4]);cloudO.updateMatrix();clouds.setMatrixAt(i,cloudO.matrix)}clouds.instanceMatrix.needsUpdate=true;
  // butterflies by day, fireflies by night
  const dayAmt=clamp((SUNALT+2)/8,0,1);
  for(const b of bugs){b.g.visible=dayAmt>0.05;if(!b.g.visible)continue;
    if(!b.init||Math.hypot(b.pos.x-P.x,b.pos.z-P.z)>20){const a=rnd()*6.28,rr=4+rnd()*7;b.pos.set(P.x+Math.cos(a)*rr,P.y+0.6+rnd()*2,P.z+Math.sin(a)*rr);b.tgt.copy(b.pos);b.init=true}
    if(b.pos.distanceTo(b.tgt)<0.6||rnd()<0.006){const a=rnd()*6.28,rr=3+rnd()*9;b.tgt.set(P.x+Math.cos(a)*rr,P.y+0.5+rnd()*2.4,P.z+Math.sin(a)*rr)}
    V.copy(b.tgt).sub(b.pos).multiplyScalar(0.9);V.y+=Math.sin(tsec*3+b.ph)*0.7;b.vel.lerp(V,Math.min(1,dt*1.6));if(b.vel.length()>2.6)b.vel.setLength(2.6);b.pos.addScaledVector(b.vel,dt);
    b.g.position.copy(b.pos);b.g.rotation.y=Math.atan2(b.vel.x,b.vel.z);const fl=0.2+1.1*Math.abs(Math.sin(tsec*b.sp+b.ph));b.L.rotation.z=fl;b.R.rotation.z=-fl}
  if(NIGHT>0.35){const arr=ffGeo.attributes.position.array;for(let i=0;i<FF;i++){const o=ffOff[i];
      arr[i*3]=((o[0]-P.x)%28+28)%28-14+P.x+Math.sin(tsec*0.5+o[3])*0.8;arr[i*3+1]=G+1+o[1]+Math.sin(tsec*0.9+o[3]*2)*0.3;arr[i*3+2]=((o[2]-P.z)%28+28)%28-14+P.z+Math.cos(tsec*0.4+o[3])*0.8}
    ffGeo.attributes.position.needsUpdate=true;ffMat.size=0.4+0.25*Math.abs(Math.sin(tsec*1.7))}
  // the four nearest lamps cast real light at night
  if(now-lightT>400){lightT=now;const on=NIGHT>0.15&&Q>0;if(on){const near=LAMPS.map(l=>[(l[0]-P.x)**2+(l[2]-P.z)**2,l]).sort((a,b)=>a[0]-b[0]);
      nightLights.forEach((l,i)=>{const t=near[i];if(t){l.position.set(t[1][0],t[1][1],t[1][2]);l.intensity=NIGHT*1.5}else l.intensity=0})}else nightLights.forEach(l=>l.intensity=0)}
  if(frameN%6===0){drawMap(miniX,224,false);if(!bigEl.hidden)drawMap(bigX,672,true)}

  sun.position.set(Math.round(P.x),G,Math.round(P.z)).addScaledVector(lightDir,110);sun.target.position.set(Math.round(P.x),G,Math.round(P.z));sun.target.updateMatrixWorld();
  // which plot is under the crosshair (or under your feet)?
  let best=-1;
  {const cp=Math.cos(P.pitch),dx=-Math.sin(P.yaw)*cp,dy=Math.sin(P.pitch),dz=-Math.cos(P.yaw)*cp,ex=P.x,ey=P.y+eyeH,ez=P.z;
   for(let t=0.3;t<18&&best<0;t+=0.15){const x=ex+dx*t,y=ey+dy*t,z=ez+dz*t,b=get(Math.floor(x),Math.floor(y),Math.floor(z));
     if(b&&b!==B.WATER&&KIND[b]!==3){for(let k=0;k<ZN;k++)if(Math.hypot(x-ZG[k].cx,z-ZG[k].cz)<PLAT+0.4){best=k;break}break}}
   if(best<0)for(let k=0;k<ZN;k++)if(Math.hypot(P.x-ZG[k].cx,P.z-ZG[k].cz)<PLAT-1)best=k}
  document.getElementById("cross").classList.toggle("on",best>=0);
  if(best!==nearZone){nearZone=best;if(best<0)promptEl.style.display="none";else{promptEl.style.display="block";promptEl.innerHTML=(TOUCH?"":"<kbd>E／點擊</kbd>")+"進入："+esc(ZONES[best].name)}}
  if(!started||uiOpen()||auto)promptEl.style.display="none";else if(nearZone>=0)promptEl.style.display="block";
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

  generate();

  makeSigns();drawMapBase();
  {const g=new THREE.BufferGeometry(),p=[];LAMPS.forEach(l=>p.push(l[0],l[1],l[2]));g.setAttribute("position",new THREE.Float32BufferAttribute(p,3));glowPts=new THREE.Points(g,glowMat);glowPts.frustumCulled=false;scene.add(glowPts)}
