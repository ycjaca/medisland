<style>
/* Layout idea: a round 3D garden. Scrolling walks a small doctor around the ring path; each stop on the ring is a section of the site. The sky follows the real sun. */
:root{
  --moss:#1b2619;
  --moss-2:#232f20;
  --line:#33452f;
  --cream:#efe8d4;
  --cream-soft:#b8b59c;
  --sun:#f2b134;
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--moss);color:var(--cream);font-family:var(--body);line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px}

/* scroll track: the page scroll drives the walk */
.walk{position:relative;height:1100vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#8cc4ea}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;border:0;padding:5px 12px 6px;border-radius:14px;
  background:rgba(255,255,255,.92);color:#2b3a22;font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap;
  box-shadow:0 4px 0 rgba(0,0,0,.15),0 8px 18px rgba(0,0,0,.18);transition:opacity .3s}
.tag::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:rgba(255,255,255,.92);border-bottom:0}
.tag.fallow{background:rgba(245,236,214,.9);color:#7a5c33}

/* HUD */
.hud{position:absolute;inset:0;pointer-events:none;padding:clamp(12px,2.4vw,24px)}
.brand{position:absolute;left:clamp(12px,2.4vw,24px);top:clamp(12px,2.4vw,22px);font-family:var(--display);font-weight:700;color:#fff;
  font-size:clamp(22px,3.2vw,36px);line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.18),0 3px 14px rgba(0,0,0,.25);letter-spacing:.02em}
.brand small{display:block;font-size:.42em;font-weight:400;letter-spacing:.12em;margin-top:6px;opacity:.95}
.clock{position:absolute;right:clamp(12px,2.4vw,24px);top:clamp(12px,2.4vw,22px);pointer-events:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;
  background:rgba(20,30,40,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:8px 12px;
  font-family:var(--mono);font-size:11.5px;color:#fff}
.clock .row{display:flex;gap:6px;align-items:center}
.clock input[type=range]{width:120px;accent-color:var(--sun)}
.chip{border:1px solid rgba(255,255,255,.6);border-radius:20px;padding:1px 9px;background:transparent;cursor:pointer;font-family:var(--mono);font-size:11px;color:#fff}
.mini{position:absolute;left:clamp(12px,2.4vw,24px);bottom:clamp(12px,2.4vw,24px);width:118px;height:118px;border-radius:50%;pointer-events:auto;cursor:pointer;
  background:rgba(20,30,40,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.55);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.mini canvas{width:100%;height:100%;display:block}
.card{position:absolute;right:clamp(12px,2.4vw,24px);bottom:clamp(14px,3vw,30px);transform:translateY(20px);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;
  width:min(400px,calc(100% - 170px));background:rgba(255,253,246,.95);color:#2b2414;border-radius:18px;padding:14px 16px 14px;box-shadow:0 6px 0 rgba(0,0,0,.12),0 14px 30px rgba(0,0,0,.25);
  display:flex;flex-direction:column;gap:6px;border:2px solid #fff}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:#8a6a40;display:flex;justify-content:space-between}
.card h3{margin:0;font-family:var(--display);font-size:24px;line-height:1.15}
.card p{margin:0;font-size:13px;color:#5d5236}
.card ul{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.card li{display:flex;gap:7px;align-items:center}
.card .btn{align-self:flex-start;margin-top:4px;border:0;border-radius:12px;padding:7px 16px;font-weight:700;cursor:pointer;background:var(--c,#f2b134);color:#2b2414;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.card .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.hint{position:absolute;left:50%;top:clamp(84px,12vh,120px);transform:translateX(-50%);color:#fff;font-size:14px;text-shadow:0 2px 10px rgba(0,0,0,.4);
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .4s;pointer-events:none}
.hint i{width:22px;height:34px;border:2px solid #fff;border-radius:12px;position:relative}
.hint i::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:7px;border-radius:2px;background:#fff;transform:translateX(-50%);animation:wheel 1.4s infinite}
@keyframes wheel{0%{opacity:0;transform:translate(-50%,-3px)}40%{opacity:1}100%{opacity:0;transform:translate(-50%,10px)}}
.progress{position:absolute;left:150px;bottom:clamp(12px,2.4vw,24px);font-family:var(--mono);font-size:11px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-size:13px;text-shadow:0 1px 8px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){.hint i::after{animation:none}.card,.tag{transition:none}}
@media (max-width:640px){.card{left:12px;right:12px;width:auto;bottom:118px;padding:10px 14px;gap:3px}.card p{display:none}.card h3{font-size:20px}.card ul{font-size:12px}.mini{width:96px;height:96px}.clock input[type=range]{width:90px}.progress{display:none}}

main{max-width:1120px;margin:0 auto;padding:40px 20px 70px}
main h2{font-family:var(--display);font-size:28px;margin:0 0 4px}
main>p{color:var(--cream-soft);margin:0 0 20px;max-width:42em}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--cream-soft);margin:0 0 22px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.zc{text-align:left;background:var(--moss-2);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:0;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.zc:hover{background:#28361f}
.zc h3{font-family:var(--display);font-size:22px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.zc h3 span{font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--cream-soft)}
.zc p{margin:0;font-size:13.5px;color:var(--cream-soft)}
.zc ul{list-style:none;margin:0;padding:0;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.zc li{display:flex;gap:8px;align-items:center}
.zc .empty{font-family:var(--mono);font-size:12px;color:#8e8a70}

.scrim{position:fixed;inset:0;background:rgba(8,14,8,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
aside.panel{position:fixed;z-index:21;top:0;right:0;height:100%;width:min(460px,100%);background:#1a2618;border-left:1px solid var(--line);transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
aside.panel.open{transform:none}
@media (max-width:700px){aside.panel{top:auto;bottom:0;height:auto;max-height:82%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(102%)}}
@media (prefers-reduced-motion:reduce){aside.panel,.scrim{transition:none}}
.p-head{padding:22px 22px 14px;border-bottom:1px solid var(--line);position:relative}
.p-head .k{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--c)}
.p-head h2{font-family:var(--display);font-size:32px;margin:2px 0 6px;line-height:1.15}
.p-head p{margin:0;color:var(--cream-soft);font-size:14px}
.close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:20px;line-height:1}
.p-body{overflow-y:auto;padding:6px 22px 28px}
.item{padding:16px 0;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.item:last-child{border-bottom:0}
.stage-l{font-family:var(--mono);font-size:11.5px;display:flex;align-items:center;gap:6px;color:var(--cream-soft)}
.item h4{margin:0;font-size:16px;font-weight:500}
.item p{margin:0;font-size:13.5px;color:var(--cream-soft)}
.go{align-self:flex-start;margin-top:4px;text-decoration:none;font-size:13px;padding:6px 14px;border-radius:20px;background:var(--sun);color:#2b2414;font-weight:500}
.fallow-note{font-family:var(--mono);font-size:13px;color:#8e8a70;padding:20px 0}
.exhibit{border:1px solid #4a3c1c;background:#2a2414;border-radius:4px;padding:16px;margin:14px 0 4px;display:flex;flex-direction:column;gap:8px}
.exhibit .k{font-family:var(--mono);font-size:11.5px;color:var(--sun);letter-spacing:.08em}
.exhibit h4{font-family:var(--display);font-size:24px;margin:0}
.exhibit p{margin:0;font-size:13.5px;color:var(--cream-soft)}
footer{border-top:1px solid var(--line);max-width:1120px;margin:0 auto;padding:18px 20px 30px;font-size:12px;color:#8e8a70;font-family:var(--mono)}
</style>
</head>
<body>

<section class="walk" id="walk" aria-label="花園散步：捲動頁面沿著環形小徑前進">
  <div class="stage" id="stage">
    <canvas id="gl" aria-hidden="true"></canvas>
    <div class="loading" id="loading">花園整理中…</div>
    <div class="tags" id="tags"></div>
    <div class="hud">
      <div class="brand">ycjacademy<small>家醫科住院醫師的學習花園</small></div>
      <div class="clock" aria-live="polite">
        <div id="where">—</div>
        <div id="sunline">—</div>
        <div class="row"><label for="scrub">時間</label><input id="scrub" type="range" min="-12" max="12" step="0.25" value="0"><button class="chip" id="nowBtn" type="button">現在</button></div>
        <div class="row"><button class="chip" id="locBtn" type="button">用我的位置</button></div>

    </div>
  </div>
</section>

<main>
  <h2>園區導覽</h2>
  <p>環形小徑上有九個區域，每件作品都標著生長階段：從一顆構想的種子，長到開花完成，最後結果，用在報告或門診。標著「整地中」的區域還在規劃。</p>
  <div class="legend" id="legend"></div>
  <div class="cards" id="cards"></div>
</main>
<footer>天空依你所在地的太陽位置即時變化（未授權位置時，依瀏覽器時區推估）。</footer>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle" aria-hidden="true">
  <div class="p-head"><div class="k" id="pKey"></div><h2 id="pTitle"></h2><p id="pDesc"></p><button class="close" id="closeBtn" aria-label="關閉">×</button></div>
  <div class="p-body" id="pBody"></div>
</aside>

/* ================= sun & sky ================= */
const RAD=Math.PI/180;
function sunPos(date,lat,lon){
  const d=date.getTime()/86400000+2440587.5-2451545.0;
  const L=(280.460+0.9856474*d)%360, g=((357.528+0.9856003*d)%360)*RAD;
  const lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*RAD, eps=(23.439-0.0000004*d)*RAD;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)), dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  const gmst=(280.46061837+360.98564736629*d)%360, H=(gmst+lon)*RAD-ra, la=lat*RAD;
  const alt=Math.asin(Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(H));
  const az=Math.atan2(-Math.sin(H),Math.tan(dec)*Math.cos(la)-Math.sin(la)*Math.cos(H));
  return {alt:alt/RAD, az:((az/RAD)+360)%360};

let NIGHT=0,SUNALT=45;
function updateSky(){
  const s=sunPos(new Date(Date.now()+offsetH*3600000),place.lat,place.lon);SUNALT=s.alt;
  const col=skyAt(s.alt);skyMat.uniforms.top.value.set(col.top).convertSRGBToLinear();skyMat.uniforms.bot.value.set(col.bot).convertSRGBToLinear();
  scene.fog.color.set(col.bot).convertSRGBToLinear();
  // world: north = -z, east = +x
  const el=Math.max(s.alt,-10)*RAD, az=s.az*RAD;
  const dir=new THREE.Vector3(Math.sin(az)*Math.cos(el),Math.sin(el),-Math.cos(az)*Math.cos(el));
  skyMat.uniforms.sunDir.value.copy(dir);
  const day=clamp((s.alt+4)/14,0,1); NIGHT=clamp((-s.alt+1)/12,0,1);
  const warm=s.alt>-6&&s.alt<16?1-Math.abs(s.alt-3)/13:0;
  skyMat.uniforms.sunCol.value.set(mixc("#fff4d6","#ff9a4a",warm)).convertSRGBToLinear();skyMat.uniforms.sunAmt.value=day;
  sun.userData.dir=dir.clone();
  sun.color.set(mixc("#fff7e8","#ffb36b",warm)).convertSRGBToLinear();
  sun.intensity = s.alt>0 ? 0.35+1.05*day : 0.25*NIGHT; // moonlight at night
  if(s.alt<=0){sun.userData.dir=new THREE.Vector3(-0.4,0.8,0.3).normalize();sun.color.set("#9db4ff").convertSRGBToLinear()}
  hemi.intensity=0.25+0.6*day; hemi.color.set(mixc("#2a3a66","#dff1ff",day)).convertSRGBToLinear(); hemi.groundColor.set(mixc("#1b2a1a","#6c8f4a",day)).convertSRGBToLinear();
  amb.intensity=NIGHT*0.35;
  starMat.opacity=clamp((-s.alt-4)/10,0,1);
  cloudMat.color.set(mixc(mixc("#ffffff","#ffc1a8",warm),"#3a4566",NIGHT)).convertSRGBToLinear(); cloudMat.opacity=0.95-NIGHT*0.55;
  lamps.forEach(l=>{l.sp.material.opacity=NIGHT*0.9;l.bulb.material.color.set(NIGHT>.2?"#ffd27a":"#fff0c8")});
  glowSpots.forEach(o=>{if(o.m)o.m.material.color.set(NIGHT>.3?o.night:o.day)});
  pavLight.intensity=NIGHT*2.2; ffMat.opacity=clamp((NIGHT-0.35)*1.6,0,1);
  renderer.toneMappingExposure=1;
  const t=new Date(Date.now()+offsetH*3600000).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
  document.getElementById("where").textContent=`${place.name} · ${t}${offsetH?`（預覽 ${offsetH>0?"+":""}${offsetH}h）`:""}`;
  document.getElementById("sunline").textContent=`太陽 ${s.alt.toFixed(0)}° · ${phase(s.alt)}`;
}

  const near=((Math.round(sParam)%N)+N)%N; curStation = Math.abs(sParam-Math.round(sParam))<0.3 ? near : -1;
  document.getElementById("hint").style.opacity = scrollFrac()<0.015 ? 1 : 0;
  document.getElementById("prog").textContent=`${Math.round(scrollFrac()*100)}%`;
  // hero always faces down the path
  hero.position.copy(P);
  hero.rotation.y=Math.atan2(F.x,F.z);
  walkPhase+=dt*clamp(moving*9,0,12);
  const sw=Math.sin(walkPhase)*clamp(moving*1.6,0,0.7);
  legs[0].rotation.x=sw;legs[1].rotation.x=-sw;arms[0].rotation.x=-sw*0.9;arms[1].rotation.x=sw*0.9;
  body.position.y=Math.abs(Math.sin(walkPhase))*clamp(moving*0.25,0,0.12) + (REDUCED?0:Math.sin(t*2)*0.02);
  // camera: always behind the walker, looking along the path
  // phones: high, steep view so both sides of the path fit a portrait screen
  const narrow=stage.clientWidth<640;
  let tp,tl;
  if(narrow){
    const T=ringPos(angOf(sParam+0.2),RP-3.5);
    tl=T.clone(); tp=T.clone().addScaledVector(F,-27).add(V(0,40,0));
  } else {
    tp=ringPos(angOf(sParam-0.36),RP).add(V(0,6.2,0));
    tl=ringPos(angOf(sParam+0.5),RP).add(V(0,0.6,0));
  }
  if(firstFrame){camPos.copy(tp);camLook.copy(tl);firstFrame=false}
  camPos.lerp(tp,REDUCED?1:Math.min(1,rawDt*6));camLook.lerp(tl,REDUCED?1:Math.min(1,rawDt*6));
  camera.position.copy(camPos);camera.lookAt(camLook);
  // sun follows the hero for crisp shadows
  sun.position.copy(P).addScaledVector(sun.userData.dir,60);sun.target.position.copy(P);sun.target.updateMatrixWorld();
  sky.position.copy(camera.position);
  // fountain & water
  if(!REDUCED){jets.forEach(j=>{const u=(j.userData.t+t*0.6)%1,a=j.userData.a;const r=0.3+u*2.6;j.position.set(Math.cos(a)*r,3.1+u*2.2-u*u*4.2,Math.sin(a)*r);j.visible=j.position.y>0.6});
    clouds.rotation.y=t*0.004;}
  // butterflies near the hero (daytime)
  const day=clamp((SUNALT+2)/8,0,1);
  butterflies.forEach((b,i)=>{b.g.visible=day>0.05;if(!b.g.visible)return;
    if(!b.init||b.pos.distanceTo(P)>26){const a=rnd()*Math.PI*2;b.pos.copy(P).add(V(Math.cos(a)*8,1+rnd()*2,Math.sin(a)*8));b.init=true}
    if(b.pos.distanceTo(b.tgt)<1||rnd()<0.005){const a=rnd()*Math.PI*2,r=3+rnd()*11;b.tgt.copy(P).add(V(Math.cos(a)*r,0.6+rnd()*2.6,Math.sin(a)*r)).addScaledVector(F,4)}
    if(!REDUCED){tmpV.copy(b.tgt).sub(b.pos).multiplyScalar(0.9);tmpV.y+=Math.sin(t*3+b.ph)*0.8;b.vel.lerp(tmpV,Math.min(1,dt*1.5));if(b.vel.length()>3.2)b.vel.setLength(3.2);b.pos.addScaledVector(b.vel,dt)}
    b.g.position.copy(b.pos);b.g.position.y+=Math.sin(t*7+b.ph)*0.08;
    b.g.rotation.y=Math.atan2(b.vel.x,b.vel.z);
    const fl=REDUCED?0.5:0.25+1.15*Math.abs(Math.sin(t*b.sp+b.ph));b.L.rotation.z=fl;b.R.rotation.z=-fl;});
  // fireflies drift around the hero's half of the garden
  if(NIGHT>0.35){const arr=ffGeo.attributes.position.array;ffBase.forEach((f,i)=>{arr[i*3]=f[0]+Math.sin(t*0.4+f[3])*1.2;arr[i*3+1]=f[1]+Math.sin(t*0.9+f[3]*2)*0.4;arr[i*3+2]=f[2]+Math.cos(t*0.35+f[3])*1.2});ffGeo.attributes.position.needsUpdate=true;
    ffMat.size=0.6+0.4*Math.abs(Math.sin(t*2));}
  // labels
  const w2=stage.clientWidth,h2=stage.clientHeight;
  ZONES.forEach((z,k)=>{const p=ringPos(angOf(k),RSk(k));p.y=tagHeights[z.id];const d=p.distanceTo(camera.position);p.project(camera);
    const vis=p.z<1&&p.z>-1&&d<(w2<640?60:46)&&Math.abs(p.x)<1.1&&Math.abs(p.y)<1.1;const el=tags[k];
    if(!vis){el.style.opacity=0;el.style.pointerEvents="none";return}
    el.style.opacity=clamp(((w2<640?60:46)-d)/10,0,1);el.style.pointerEvents="auto";
    el.style.left=((p.x+1)/2*w2)+"px";el.style.top=((1-p.y)/2*h2)+"px";el.style.fontSize=(w2<640?clamp(260/d,10.5,14):clamp(330/d,12,19))+"px"});
  drawMini(theta);
  renderer.render(scene,camera);
  if(document.getElementById("loading"))document.getElementById("loading").remove();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// click a plot in the garden to enter it
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
function pickZone(e){const r=canvas.getBoundingClientRect();ptr.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(stationGroups,true);for(const h of hits){let o=h.object;while(o&&o.userData.k===undefined)o=o.parent;if(o&&h.distance<60)return o.userData.k}return -1}
canvas.addEventListener("click",e=>{const k=pickZone(e);if(k>=0)openZone(ZONES[k].id)});
let hoverT=0;canvas.addEventListener("pointermove",e=>{const n=performance.now();if(n-hoverT<80)return;hoverT=n;const k=pickZone(e);canvas.style.cursor=k>=0?"pointer":"default";tags.forEach((t,i)=>t.style.transform=i===k?"translate(-50%,-100%) scale(1.12)":"")});
// deep link: #expo etc.
const h=location.hash.slice(1),k=ZONES.findIndex(z=>z.id===h);
if(k>=0){setTimeout(()=>{scrollToZone(k);setTimeout(()=>openZone(ZONES[k].id,true),900)},300)}
addEventListener("hashchange",()=>{const k=ZONES.findIndex(z=>z.id===location.hash.slice(1));if(k>=0)openZone(ZONES[k].id,true)});
}
