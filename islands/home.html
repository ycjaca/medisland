<style>
/* Layout idea: a night-time nautical chart. Each theme is an island; its contour rings = number of talks. Tap an island to open its log. */
:root{
  --sea:#0d2a33;
  --sea-deep:#082028;
  --grid:#1a4350;
  --ink:#e8efe9;
  --ink-soft:#9fb9b8;
  --buoy:#f2b134;
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sea);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--buoy);outline-offset:3px}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

header.hero{padding:40px 0 18px;display:grid;grid-template-columns:1fr auto;gap:16px 32px;align-items:end}
.coords{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase}
h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,7vw,76px);line-height:1.05;margin:6px 0 10px;letter-spacing:.02em;text-wrap:balance}
h1 small{display:block;font-size:.36em;font-weight:400;color:var(--ink-soft);letter-spacing:.12em;margin-top:8px}
.lede{max-width:34em;color:var(--ink-soft);margin:0}
.tally{display:flex;gap:22px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tally div{display:flex;flex-direction:column;align-items:flex-start}
.tally b{font-family:var(--display);font-size:40px;line-height:1;color:var(--buoy);font-weight:700}
.tally span{font-size:11px;color:var(--ink-soft);letter-spacing:.1em}

.chart{position:relative;margin-top:14px;border:1px solid var(--grid);border-radius:4px;background:
  radial-gradient(ellipse at 50% 45%, #10343f 0%, var(--sea-deep) 75%);overflow:hidden}
.chart svg{display:block;width:100%;height:auto}
.chart .legend{position:absolute;left:14px;bottom:10px;font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:.06em;pointer-events:none}

.island{cursor:pointer}
.island .land{transition:transform .35s cubic-bezier(.2,.8,.2,1);transform-box:fill-box;transform-origin:center}
.island:hover .land,.island:focus-visible .land,.island.on .land{transform:scale(1.06) translateY(-4px)}
.island:focus{outline:none}
.island:focus-visible .lbl-name{fill:var(--buoy)}
.island.on .lbl-name{fill:var(--buoy)}
.lbl-name{font-family:var(--display);font-size:30px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--sea-deep);stroke-width:6px;stroke-linejoin:round}
.lbl-sub{font-family:var(--mono);font-size:15px;fill:var(--ink-soft);paint-order:stroke;stroke:var(--sea-deep);stroke-width:5px;letter-spacing:.06em}

.waves path{animation:drift 9s ease-in-out infinite alternate}
.waves path:nth-child(2n){animation-duration:12s}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@media (prefers-reduced-motion:reduce){.waves path{animation:none}.island .land{transition:none}}

.hint{font-size:13px;color:var(--ink-soft);margin:10px 0 0;display:flex;gap:8px;align-items:center}
.hint::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--buoy);box-shadow:0 0 0 4px rgba(242,177,52,.18)}

section.atlas{padding:44px 0 70px}
section.atlas h2{font-family:var(--display);font-size:28px;font-weight:700;margin:0 0 4px}
section.atlas>.wrap>p{color:var(--ink-soft);margin:0 0 22px;max-width:40em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{text-align:left;background:rgba(255,255,255,.02);border:1px solid var(--grid);border-left:4px solid var(--c);border-radius:4px;padding:16px 16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:background .2s,border-color .2s}
.card:hover{background:rgba(255,255,255,.05)}
.card h3{font-family:var(--display);font-size:22px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3 span{font-family:var(--mono);font-size:12px;color:var(--ink-soft);font-weight:400}
.card p{margin:0;font-size:13px;color:var(--ink-soft)}
.card ul{margin:0;padding:0;list-style:none;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.card li{display:flex;gap:8px}
.card li::before{content:"";flex:none;width:5px;height:5px;margin-top:.62em;border-radius:50%;background:var(--c)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(4,16,20,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
aside.log{position:fixed;z-index:21;top:0;right:0;height:100%;width:min(480px,100%);background:#0a252d;border-left:1px solid var(--grid);transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
aside.log.open{transform:none}
@media (max-width:700px){
  aside.log{top:auto;bottom:0;height:auto;max-height:82%;width:100%;border-left:0;border-top:1px solid var(--grid);border-radius:14px 14px 0 0;transform:translateY(102%)}
}
@media (prefers-reduced-motion:reduce){aside.log,.scrim{transition:none}}
.log-head{padding:22px 22px 14px;border-bottom:1px solid var(--grid);position:relative}
.log-head .coords{color:var(--c)}
.log-head h2{font-family:var(--display);font-size:32px;margin:2px 0 6px;line-height:1.15}
.log-head p{margin:0;color:var(--ink-soft);font-size:14px}
.close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--grid);background:transparent;cursor:pointer;font-size:20px;line-height:1}
.close:hover{background:rgba(255,255,255,.06)}
.log-body{overflow-y:auto;padding:8px 22px 28px}
.talk{padding:16px 0;border-bottom:1px dashed var(--grid);display:grid;grid-template-columns:62px 1fr;gap:4px 14px}
.talk:last-child{border-bottom:0}
.talk .when{font-family:var(--mono);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;line-height:1.5;padding-top:2px}

footer{border-top:1px solid var(--grid);padding:18px 0 30px;font-size:12px;color:var(--ink-soft);font-family:var(--mono)}

@media (max-width:700px){
  header.hero{grid-template-columns:1fr;padding-top:26px}
  .tally b{font-size:32px}

</style>

// seeded random for stable coastlines
function rng(seed){let s=0;for(const c of seed)s=(s*31+c.charCodeAt(0))>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function blob(cx,cy,r,seed,k){
  const rand=rng(seed), harm=[1,2,3,5].map(n=>({n,a:(rand()*0.12+0.03)/Math.sqrt(n),p:rand()*Math.PI*2}));
  const pts=[],N=72;
  for(let i=0;i<N;i++){const t=i/N*Math.PI*2;let m=1;for(const h of harm)m+=h.a*Math.sin(h.n*t+h.p);
    pts.push([cx+Math.cos(t)*r*k*m*1.12, cy+Math.sin(t)*r*k*m*0.86]);}
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<N;i++){const p0=pts[(i-1+N)%N],p1=pts[i],p2=pts[(i+1)%N],p3=pts[(i+2)%N];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=`C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;}
  return d+"Z";
}
function mix(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const t=amt<0?[8,32,40]:[240,236,220],a=Math.abs(amt);
  r=Math.round(r+(t[0]-r)*a);g=Math.round(g+(t[1]-g)*a);b=Math.round(b+(t[2]-b)*a);return`rgb(${r},${g},${b})`}

const NS="http://www.w3.org/2000/svg", svg=document.getElementById("map");
const el=(n,a={},p=svg)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};

// chart grid + compass
const g0=el("g",{stroke:"#1a4350","stroke-width":1});
for(let x=50;x<1000;x+=100)el("line",{x1:x,y1:0,x2:x,y2:640},g0);
for(let y=40;y<640;y+=100)el("line",{x1:0,y1:y,x2:1000,y2:y},g0);
const gl=el("g",{"font-family":"IBM Plex Mono, monospace","font-size":11,fill:"#3f6f7a"});
"ABCDEFGHIJ".split("").forEach((c,i)=>{const t=el("text",{x:50+i*100+4,y:16},gl);t.textContent=c});
[1,2,3,4,5,6].forEach((n,i)=>{const t=el("text",{x:6,y:40+i*100-4},gl);t.textContent=n});
// waves
const wv=el("g",{class:"waves",fill:"none",stroke:"#21535f","stroke-width":1.4,"stroke-linecap":"round"});
[[60,330],[470,70],[300,590],[720,90],[960,330],[540,600],[30,600],[780,590]].forEach(([x,y])=>{
  el("path",{d:`M${x},${y} q10,-7 20,0 t20,0 t20,0`},wv)});
// compass rose
const cp=el("g",{transform:"translate(940,585)",stroke:"#3f6f7a",fill:"none"});
el("circle",{r:26},cp);el("circle",{r:3,fill:"#3f6f7a"},cp);
el("path",{d:"M0,-34 L5,0 L0,34 L-5,0Z",fill:"#3f6f7a",stroke:"none"},cp);
el("path",{d:"M-34,0 L0,4 L34,0 L0,-4Z",fill:"#2a5662",stroke:"none"},cp);
const nn=el("text",{y:-40,"text-anchor":"middle","font-family":"IBM Plex Mono, monospace","font-size":11,fill:"#3f6f7a",stroke:"none"},cp);nn.textContent="N";

// islands
const nodes={};
ISLANDS.forEach(is=>{
  const n=is.talks.length;
  const g=el("g",{class:"island",tabindex:0,role:"button","aria-label":`${is.name}，${n} 場講題`});
  const land=el("g",{class:"land"},g);
  el("path",{d:blob(is.x,is.y+6,is.r,is.id,1.08),fill:"#06181e",opacity:.55},land); // shadow
  el("path",{d:blob(is.x,is.y,is.r,is.id,1.16),fill:"none",stroke:mix(is.hue,.1),"stroke-opacity":.25,"stroke-width":1.2,"stroke-dasharray":"3 5"},land); // shoal
  for(let i=0;i<n;i++){
    const k=1-i*(0.82/Math.max(n,2));
    el("path",{d:blob(is.x,is.y,is.r,is.id,k),fill:mix(is.hue,-0.55+i*(0.6/n)),stroke:mix(is.hue,0.25),"stroke-width":i===0?1.6:1,"stroke-opacity":.7},land);
  }
  if(is.talks.some(t=>t.lunch)){ // lunch buoy
    const b=el("g",{transform:`translate(${is.x+is.r*0.95},${is.y-is.r*0.7})`},land);
    el("circle",{r:6,fill:"#f2b134"},b);el("circle",{r:11,fill:"none",stroke:"#f2b134","stroke-opacity":.35},b);
  }
  const lx=is.x, ly=is.y+is.r*0.86+34;
  const t1=el("text",{x:lx,y:ly,"text-anchor":"middle",class:"lbl-name"},g);t1.textContent=is.name;
  const t2=el("text",{x:lx,y:ly+22,"text-anchor":"middle",class:"lbl-sub"},g);t2.textContent=`${n} TALKS`;
  g.addEventListener("click",()=>openIsland(is.id));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openIsland(is.id)}});
  nodes[is.id]=g;
});
// legend buoy note
const lg=el("g",{transform:"translate(30,616)"});
el("circle",{r:5,fill:"#f2b134"},lg);
const lt=el("text",{x:12,y:4,"font-family":"IBM Plex Mono, monospace","font-size":12,fill:"#9fb9b8"},lg);lt.textContent="浮標 = 含午餐研討會";
const lt2=el("text",{x:190,y:4,"font-family":"IBM Plex Mono, monospace","font-size":12,fill:"#9fb9b8"},lg);lt2.textContent="◎ 1 圈等高線 = 1 場講題";

// cards
const cards=document.getElementById("cards");
ISLANDS.forEach(is=>{
  const b=document.createElement("button");b.className="card";b.style.setProperty("--c",is.hue);
  b.innerHTML=`<h3>${is.name}<span>${is.talks.length} 場</span></h3><p>${is.desc}</p><ul>${is.talks.map(t=>`<li>${short(t.t)}</li>`).join("")}</ul>`;
  b.addEventListener("click",()=>openIsland(is.id));cards.appendChild(b);
});
function short(s){return s.split(/[：—]/)[0]}

// drawer
const log=document.getElementById("log"),scrim=document.getElementById("scrim");
let lastFocus=null;
function openIsland(id,fromHash){
  const is=ISLANDS.find(i=>i.id===id);if(!is)return;
  lastFocus=document.activeElement;
  Object.values(nodes).forEach(n=>n.classList.remove("on"));nodes[id].classList.add("on");
  log.style.setProperty("--c",is.hue);
  document.getElementById("logCoords").textContent=`ISLAND ${String(ISLANDS.indexOf(is)+1).padStart(2,"0")} / ${String(ISLANDS.length).padStart(2,"0")} · ${is.talks.length} 場講題`;
  document.getElementById("logTitle").textContent=is.name;
  document.getElementById("logDesc").textContent=is.desc;
  const sorted=[...is.talks].sort((a,b)=>a.time.localeCompare(b.time));
  document.getElementById("logBody").innerHTML=sorted.map(t=>`
    <div class="talk">
      <div class="when">${t.time}</div>
      <div>
        <h4>${t.t}</h4>
        <div class="who"><span class="room${t.lunch?" lunch":""}">${t.lunch?"午餐 · ":""}${t.room}</span>${t.s}｜${t.h}</div>
      </div>
      ${t.url?`<a class="dive live" href="${t.url}">深入探索 →</a>`:`<button class="dive" disabled title="深入頁面製作中">深入探索 · 製作中</button>`}
    </div>`).join("");
  document.getElementById("logBody").scrollTop=0;
  log.classList.add("open");scrim.classList.add("open");log.setAttribute("aria-hidden","false");
  document.getElementById("closeBtn").focus({preventScroll:true});
  if(!fromHash&&location.hash!=="#"+id){try{history.replaceState(null,"","#"+id)}catch(e){location.hash=id}}
}
function closeLog(){
  log.classList.remove("open");scrim.classList.remove("open");log.setAttribute("aria-hidden","true");
  Object.values(nodes).forEach(n=>n.classList.remove("on"));
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});
}
document.getElementById("closeBtn").addEventListener("click",closeLog);
scrim.addEventListener("click",closeLog);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&log.classList.contains("open"))closeLog()});
function route(){const h=location.hash.slice(1);if(h&&nodes[h])openIsland(h,true)}
window.addEventListener("hashchange",route);route();
</script>
</body>
