<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家醫群島 115 秋季會</title>
<style>
/* Shell: loads each page of the site into one frame so links work inside the claude.ai viewer and on GitHub Pages alike. */
:root{--sea:#0d2a33;--ink-soft:#9fb9b8;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--sea)}
#view{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--sea)}
#status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:14px "Noto Sans TC",sans-serif;color:var(--ink-soft);pointer-events:none}
#status[hidden]{display:none}
</style>
</head>
<body>
<div id="status">載入中…</div>
<script>
const PAGES = ["home","type2-diabetes","obesity","atrial-fibrillation","ldl-c","sleep","myofascial-pain","sarcopenia"];
const ISLANDS = ["metabolic","cardiorenal","vaccine","brain","pain","prevention","women","aging","tech"];
let view = null; const status = document.getElementById("status");
// a fresh frame per page, with a unique name, so the browser never restores a stale frame on reload
function freshFrame(){
  if(view) view.remove();
  view = document.createElement("iframe");
  view.id = "view"; view.title = "家醫群島";
  view.name = "page-" + Date.now() + "-" + Math.random().toString(36).slice(2);
  document.body.appendChild(view);
  return view;
}
const cache = {};
let current = null;

// hash forms: "" → home; "<island>" → home with island open; "<page>" or "<page>--<anchor>" → deep page
function parse(hash){
  const h = decodeURIComponent((hash||"").replace(/^#/,""));
  if(!h) return {page:"home"};
  if(ISLANDS.includes(h)) return {page:"home", island:h};
  const [p, a] = h.split("--");
  if(PAGES.includes(p)) return {page:p, anchor:a||null};
  return {page:"home"};
}
function toHash(page, frag){
  if(page==="home" || page==="index") return frag && ISLANDS.includes(frag) ? frag : "";
  return frag ? `${page}--${frag}` : page;
}
function go(hash){
  if(("#"+hash) === location.hash || (hash==="" && !location.hash)) route(); else location.hash = hash;
}

async function getPage(page){
  if(cache[page]) return cache[page];
  const r = await fetch(page + ".html", {credentials:"same-origin", cache:"no-cache"});
  if(!r.ok) throw new Error(r.status);
  return cache[page] = await r.text();
}

async function route(){
  const {page, island, anchor} = parse(location.hash);
  if(page === current){ afterLoad(page, island, anchor); return; }
  status.hidden = false;
  try{
    const html = await getPage(page);
    const f = freshFrame();
    f.onload = () => { current = page; status.hidden = true; wire(); afterLoad(page, island, anchor); };
    f.srcdoc = html;
  }catch(e){
    status.hidden = false;
    status.textContent = "這一頁載入失敗（" + e.message + "），請重新整理再試一次。";
  }
}

function afterLoad(page, island, anchor){
  if(!view) return;
  const w = view.contentWindow, d = view.contentDocument;
  if(!d) return;
  document.title = d.title || document.title;
  if(page === "home"){
    if(island && typeof w.openIsland === "function") w.openIsland(island, true);
    else if(!island && typeof w.closeLog === "function" && d.getElementById("log")?.classList.contains("open")) w.closeLog();
    return;
  }
  if(anchor){
    const t = d.getElementById(anchor);
    if(t) setTimeout(()=>t.scrollIntoView({block:"start"}), 50);
  } else {
    w.scrollTo(0,0);
  }
}

// catch link clicks inside the framed page
function wire(){
  if(!view) return;
  const d = view.contentDocument;
  if(!d) return;
  d.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest("a[href]");
    if(!a) return;
    const href = a.getAttribute("href");
    const m = href.match(/^(?:\.\/)?([\w-]+)\.html(?:#([\w-]+))?$/);
    if(m){
      e.preventDefault();
      const page = m[1] === "index" ? "home" : m[1];
      go(toHash(page, m[2]));
      return;
    }
    if(href.startsWith("#") && href.length > 1 && !e.defaultPrevented){
      const t = d.getElementById(href.slice(1));
      if(t){ e.preventDefault(); t.scrollIntoView({behavior:"smooth", block:"start"}); }
    }
  });
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
